<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Race Control Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#05080e;--card:#0c131f;--card2:#09101a;--line:rgba(0,180,255,.2);--tx:#e6edf5;--mut:#8696a8;--acc:#14c0ff;--warn:#ffb340;--bad:#ff6b61;--ok:#3ddc84}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,rgba(0,120,200,.22),transparent 55%),var(--bg);color:var(--tx);font:15px/1.45 Barlow,system-ui,sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(5,8,14,.92);backdrop-filter:blur(8px);z-index:5}
.logo{font:800 24px "Barlow Condensed",sans-serif;letter-spacing:.14em}.logo b{color:var(--acc)}
.tag{font:800 11px "Barlow Condensed",sans-serif;letter-spacing:.2em;color:var(--warn);border:1px solid rgba(255,179,64,.5);border-radius:6px;padding:2px 8px}
nav{display:flex;gap:6px;margin-left:auto}
nav button,.btn{background:#0b1522;border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:8px 14px;font:600 14px Barlow,sans-serif;cursor:pointer}
nav button.on{border-color:var(--acc);color:var(--acc)}
.btn.primary{background:linear-gradient(180deg,#19b8ff,#0a86d0);border-color:transparent;color:#021019;font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
main{max-width:1280px;margin:0 auto;padding:22px 24px 60px}
.hide{display:none!important}
h2{font:800 15px "Barlow Condensed",sans-serif;letter-spacing:.18em;color:#7fd4ff;margin:0 0 10px;text-transform:uppercase}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px}
textarea{width:100%;min-height:130px;background:#04080e;border:1px solid var(--line);border-radius:10px;color:var(--tx);font:12.5px/1.4 ui-monospace,Consolas,monospace;padding:10px;resize:vertical}
input[type=search]{background:#04080e;border:1px solid var(--line);border-radius:9px;color:var(--tx);padding:8px 12px;font:inherit;min-width:220px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut)}.sm{font-size:12.5px}.err{color:var(--bad)}.ok{color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:12px}
.tr{background:var(--card2);border:1px solid rgba(255,255,255,.06);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s}
.tr:hover{border-color:var(--acc);transform:translateY(-2px)}
.tr canvas{display:block;width:100%;aspect-ratio:4/3;background:#0a1a10}
.tr .ti{padding:8px 10px}.tr .tn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr.empty{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3.9;color:var(--mut);cursor:default;border-style:dashed}.tr.empty:hover{transform:none;border-color:rgba(255,255,255,.06)}
.user{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.uh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 18px "Barlow Condensed",sans-serif;background:linear-gradient(135deg,#14c0ff,#0060a0);color:#fff;flex:none}
.uh b{font-size:17px}.chip{font-size:12px;padding:2px 8px;border-radius:20px;background:rgba(20,192,255,.12);color:#7fd4ff}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:140px}.stat b{display:block;font:800 26px "Barlow Condensed",sans-serif;color:var(--acc)}
#big{position:fixed;inset:0;background:rgba(2,5,10,.86);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
#big .bx{background:var(--card);border:1px solid var(--line);border-radius:16px;width:min(900px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:16px}
#big canvas{width:100%;aspect-ratio:4/3;border-radius:10px;background:#0a1a10;display:block}
#big pre{max-height:160px;overflow:auto;background:#04080e;border-radius:8px;padding:8px;font-size:11.5px;white-space:pre-wrap;word-break:break-all}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0;font-size:14px}.kv span{color:var(--mut)}
code{background:#04080e;border-radius:6px;padding:2px 6px}
@media (max-width:640px){header,main{padding-left:16px;padding-right:16px}nav{margin-left:0;width:100%}nav button{flex:1}}
</style>
</head>
<body>
<header>
  <div class="logo">RACE <b>CONTROL</b></div><span class="tag">ADMIN</span>
  <nav><button data-tab="users" class="on">Alle Nutzer</button><button data-tab="decode">Code auslesen</button></nav>
</header>
<main>
  <!-- ===== Alle Nutzer ===== -->
  <section id="tabUsers">
    <div class="panel" id="authBox">
      <h2>Anmeldung</h2>
      <div id="authState" class="mut">Verbinde …</div>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="gBtn">Mit Google anmelden</button><button class="btn hide" id="outBtn">Abmelden</button><button class="btn hide" id="reloadBtn">Neu laden</button></div>
    </div>
    <div id="usersArea" class="hide">
      <div class="stats" id="stats"></div>
      <div class="row" style="margin-bottom:12px"><input type="search" id="q" placeholder="Nutzer oder Strecke suchen …"><label class="sm mut"><input type="checkbox" id="onlyTracks" checked> nur Nutzer mit Strecken</label></div>
      <div id="users"></div>
    </div>
  </section>
  <!-- ===== Code auslesen ===== -->
  <section id="tabDecode" class="hide">
    <div class="panel">
      <h2>Strecken-Code auslesen</h2>
      <p class="mut sm" style="margin-top:0">Füge hier einen Strecken-Code ein (der Inhalt von <code>rc_tracks</code> – eine Liste mit bis zu 5 Plätzen oder eine einzelne Strecke). Die Strecken werden sofort als Bild angezeigt.</p>
      <textarea id="code" spellcheck="false" placeholder='[{"name":"…","km":2.5,"w":72,"street":false,"pts":[[x,y],…],"t":…},null,…]'></textarea>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="decBtn">Auslesen</button><span id="decMsg" class="sm"></span></div>
      <div class="grid" id="decOut"></div>
    </div>
  </section>
</main>
<div id="big" class="hide"><div class="bx">
  <div class="row" style="justify-content:space-between"><h2 id="bigT" style="margin:0"></h2><div class="row"><button class="btn" id="pngBtn">Bild speichern</button><button class="btn" id="copyBtn">Code kopieren</button><button class="btn" id="closeBtn">Schließen</button></div></div>
  <div class="kv" id="bigKv"></div><canvas id="bigC" width="1200" height="900"></canvas><pre id="bigCode"></pre>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const CFG={"apiKey":"AIzaSyBD7xCktpppYvkdN8oVPf4TTQi-TbRioes","authDomain":"race-control-76c0a.firebaseapp.com","projectId":"race-control-76c0a","storageBucket":"race-control-76c0a.firebasestorage.app","messagingSenderId":"513418250579","appId":"1:513418250579:web:74459232e8f84229d5b9a6"};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=t=>t?new Date(t).toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'}):'–';

/* ---------- Tabs ---------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  $('tabUsers').classList.toggle('hide',b.dataset.tab!=='users');$('tabDecode').classList.toggle('hide',b.dataset.tab!=='decode')});

/* ---------- Strecken-Code lesen ---------- */
function parseTracks(raw){
  let d=raw;if(typeof d==='string'){d=d.trim();if(!d)return [];d=JSON.parse(d)}
  if(typeof d==='string')d=JSON.parse(d);                          // doppelt verpackt
  if(d&&!Array.isArray(d)&&d.rc_tracks!=null)return parseTracks(d.rc_tracks);
  if(d&&!Array.isArray(d))d=[d];
  return d.map(t=>t&&Array.isArray(t.pts)&&t.pts.length>2?t:null);
}
/* ---------- Strecke zeichnen ---------- */
function drawTrack(cv,t){
  const g=cv.getContext('2d'),W=cv.width,H=cv.height;g.clearRect(0,0,W,H);
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#10291a');bg.addColorStop(1,'#0a1d12');g.fillStyle=bg;g.fillRect(0,0,W,H);
  const P=t.pts;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const [x,y] of P){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}
  const pad=W*.09,sc=Math.min((W-2*pad)/Math.max(1,x1-x0),(H-2*pad)/Math.max(1,y1-y0)),ox=(W-(x1-x0)*sc)/2,oy=(H-(y1-y0)*sc)/2;
  const X=p=>ox+(p[0]-x0)*sc,Y=p=>oy+(p[1]-y0)*sc;
  // Streckenbreite: w ist relativ zur Streckenlänge (km) – auf das Bild umgerechnet
  let len=0;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];len+=Math.hypot(b[0]-a[0],b[1]-a[1])}
  const mPerUnit=(t.km||2)*1000/Math.max(1,len),wPx=clamp(((t.w||60)/6)/mPerUnit*sc,W*.024,W*.06);
  const path=()=>{g.beginPath();g.moveTo(X(P[0]),Y(P[0]));for(let i=1;i<P.length;i++)g.lineTo(X(P[i]),Y(P[i]));g.closePath()};
  g.lineJoin='round';g.lineCap='round';
  path();g.strokeStyle=t.street?'#6d6458':'#2c7a3c';g.lineWidth=wPx*2.1;g.stroke();       // Auslauf / Mauern
  path();g.strokeStyle='#e8e8e8';g.lineWidth=wPx*1.22;g.stroke();                          // Randlinie
  path();g.strokeStyle='#2b2f36';g.lineWidth=wPx;g.stroke();                               // Asphalt
  g.setLineDash([W*.012,W*.012]);path();g.strokeStyle='rgba(255,255,255,.18)';g.lineWidth=Math.max(1,W*.002);g.stroke();g.setLineDash([]);
  // Start/Ziel + Fahrtrichtung
  const a=P[0],b=P[1%P.length],ang=Math.atan2(Y(b)-Y(a),X(b)-X(a));
  g.save();g.translate(X(a),Y(a));g.rotate(ang);const sq=wPx/6;
  for(let i=-3;i<3;i++)for(let j=0;j<2;j++){g.fillStyle=(i+j)%2?'#fff':'#111';g.fillRect(j*sq-sq,i*sq,sq,sq)}
  g.fillStyle='#14c0ff';g.beginPath();g.moveTo(wPx*1.6,0);g.lineTo(wPx*.9,-wPx*.45);g.lineTo(wPx*.9,wPx*.45);g.closePath();g.fill();g.restore();
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function trackCard(t,i,owner){
  const d=document.createElement('div');
  if(!t){d.className='tr empty';d.textContent='Platz '+(i+1)+' leer';return d}
  d.className='tr';const cv=document.createElement('canvas');cv.width=400;cv.height=300;d.appendChild(cv);drawTrack(cv,t);
  d.insertAdjacentHTML('beforeend',`<div class="ti"><div class="tn">${esc(t.name||'Ohne Name')}</div><div class="sm mut">${t.km?t.km+' km':''}${t.street?' · Stadtkurs':''} · ${t.pts.length} Punkte</div><div class="sm mut">${fmtDate(t.t)}</div></div>`);
  d.onclick=()=>openBig(t,owner);return d;
}
let BIG=null;
function openBig(t,owner){BIG=t;$('bigT').textContent=t.name||'Ohne Name';
  $('bigKv').innerHTML=`${owner?`<span>Ersteller</span><b>${esc(owner)}</b>`:''}<span>Länge</span><b>${t.km!=null?t.km+' km':'–'}</b><span>Breite (w)</span><b>${t.w!=null?t.w:'–'}</b><span>Typ</span><b>${t.street?'Stadtkurs':'Rennstrecke'}</b><span>Punkte</span><b>${t.pts.length}</b><span>Erstellt</span><b>${fmtDate(t.t)}</b>`;
  drawTrack($('bigC'),t);$('bigCode').textContent=JSON.stringify(t);$('big').classList.remove('hide')}
$('closeBtn').onclick=()=>$('big').classList.add('hide');$('big').onclick=e=>{if(e.target.id==='big')$('big').classList.add('hide')};
$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(BIG));$('copyBtn').textContent='Kopiert ✓';setTimeout(()=>$('copyBtn').textContent='Code kopieren',1500)}catch(_){}};
$('pngBtn').onclick=()=>{const a=document.createElement('a');a.download=(BIG.name||'strecke').replace(/[^\w\-äöüÄÖÜß ]+/g,'')+'.png';a.href=$('bigC').toDataURL('image/png');a.click()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('big').classList.add('hide')});
$('decBtn').onclick=()=>{
  const out=$('decOut');out.innerHTML='';
  try{const L=parseTracks($('code').value);const n=L.filter(Boolean).length;
    $('decMsg').className='sm ok';$('decMsg').textContent=n?`${n} Strecke${n===1?'':'n'} gefunden`:'Keine Strecke im Code';
    L.forEach((t,i)=>out.appendChild(trackCard(t,i)))}
  catch(e){$('decMsg').className='sm err';$('decMsg').textContent='Ungültiger Code: '+e.message}};

/* ---------- Firebase: alle Nutzer ---------- */
let DB=null,AUTH=null,ALL=[];
try{firebase.initializeApp(CFG);AUTH=firebase.auth();DB=firebase.firestore()}catch(e){$('authState').innerHTML='<span class="err">Firebase konnte nicht geladen werden.</span>'}
if(AUTH){
  if(location.protocol==='file:'){$('authState').innerHTML='Die Anmeldung funktioniert nur online: <a style="color:#7fd4ff" href="https://nevillejr.github.io/Race-control/admin.html">nevillejr.github.io/Race-control/admin.html</a>. „Code auslesen“ funktioniert auch offline.'}
  AUTH.onAuthStateChanged(u=>{
    $('gBtn').classList.toggle('hide',!!u);$('outBtn').classList.toggle('hide',!u);$('reloadBtn').classList.toggle('hide',!u);
    if(!u){if(location.protocol!=='file:')$('authState').textContent='Melde dich mit dem Admin-Google-Konto an.';$('usersArea').classList.add('hide');return}
    $('authState').innerHTML=`Angemeldet als <b>${esc(u.displayName||'Google-Konto')}</b> · Admin-ID: <code id="uidTxt">${esc(u.uid)}</code>`;
    loadUsers();
  });
  $('gBtn').onclick=async()=>{try{await AUTH.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){$('authState').innerHTML='<span class="err">Anmeldung fehlgeschlagen: '+esc(e.code||e.message)+'</span>'}};
  $('outBtn').onclick=()=>AUTH.signOut();$('reloadBtn').onclick=()=>loadUsers();
}
async function loadUsers(){
  $('users').innerHTML='<p class="mut">Lade alle Nutzer …</p>';$('usersArea').classList.remove('hide');
  try{
    const snap=await DB.collection('users').get();
    ALL=snap.docs.map(d=>{const v=d.data()||{},sv=v.save||{};let tracks=[];try{tracks=parseTracks(sv.rc_tracks||'[]')}catch(_){}
      let career=null;try{career=typeof sv.rc_career==='string'?JSON.parse(sv.rc_career):sv.rc_career}catch(_){}
      return {uid:d.id,name:v.name||'(ohne Name)',updated:v.updated||0,tracks,career}}).sort((a,b)=>b.updated-a.updated);
    render();
  }catch(e){
    $('users').innerHTML=e.code==='permission-denied'?`<div class="panel"><b class="err">Kein Admin-Zugriff.</b><p class="mut" style="margin-bottom:0">Dieses Konto ist noch nicht als Admin freigeschaltet. Admin-ID: <code>${esc(AUTH.currentUser&&AUTH.currentUser.uid)}</code></p></div>`:`<p class="err">Fehler: ${esc(e.code||e.message)}</p>`;
    $('stats').innerHTML='';
  }
}
function render(){
  const q=$('q').value.trim().toLowerCase(),only=$('onlyTracks').checked;
  const L=ALL.filter(u=>(!only||u.tracks.some(Boolean))&&(!q||u.name.toLowerCase().includes(q)||u.tracks.some(t=>t&&String(t.name||'').toLowerCase().includes(q))));
  const nT=ALL.reduce((s,u)=>s+u.tracks.filter(Boolean).length,0),withT=ALL.filter(u=>u.tracks.some(Boolean)).length,act=ALL.filter(u=>Date.now()-u.updated<7*864e5).length;
  $('stats').innerHTML=`<div class="stat"><b>${ALL.length}</b><span class="mut sm">Spielstände</span></div><div class="stat"><b>${nT}</b><span class="mut sm">eigene Strecken</span></div><div class="stat"><b>${withT}</b><span class="mut sm">Nutzer mit Strecken</span></div><div class="stat"><b>${act}</b><span class="mut sm">aktiv (7 Tage)</span></div>`;
  const box=$('users');box.innerHTML=L.length?'':'<p class="mut">Keine passenden Nutzer.</p>';
  for(const u of L){
    const el=document.createElement('div');el.className='user';const n=u.tracks.filter(Boolean).length;
    el.innerHTML=`<div class="uh"><div class="av">${esc((u.name[0]||'?').toUpperCase())}</div><div><b>${esc(u.name)}</b><div class="sm mut">zuletzt aktiv ${fmtDate(u.updated)}</div></div>
      <span class="chip">${n} Strecke${n===1?'':'n'}</span>${u.career&&u.career.tier!=null?`<span class="chip">Karriere-Stufe ${esc(u.career.tier)}</span>`:''}</div>`;
    const g=document.createElement('div');g.className='grid';
    const ts=u.tracks.length?u.tracks:[];ts.forEach((t,i)=>{if(t||!only)g.appendChild(trackCard(t,i,u.name))});
    if(!ts.some(Boolean))g.insertAdjacentHTML('beforeend','<p class="mut sm">Keine eigenen Strecken.</p>');
    el.appendChild(g);box.appendChild(el);
  }
}
$('q').oninput=render;$('onlyTracks').onchange=render;
</script>
</body>
</html>
